mqtt:
  broker: localhost
  port: 1883
  username: null
  password: null
  topic_prefix: meshcore
  qos: 0
  retain: false

meshcore:
  connection_type: tcp
  address: "192.168.1.100"
  port: 5000
  baudrate: 115200
  timeout: 5
  auto_fetch_restart_delay: 5
  events:
    - CONTACT_MSG_RECV
    - CHANNEL_MSG_RECV
    - CONNECTED
    - DISCONNECTED
    - LOGIN_SUCCESS
    - LOGIN_FAILED
    - MESSAGES_WAITING
    - DEVICE_INFO
    - BATTERY
    - NEW_CONTACT
    - ADVERTISEMENT

# Optional raw packet bridge. Requires serial MeshCore connection.
# Configure reciprocal peer_ids and a unique dedup_db on each instance.
packet_bridge:
  enabled: false
  topic_root: meshcore/bridge
  link_id: backhaul-1
  endpoint_id: a
  peer_ids:
    - b
  envelope_ttl_ms: 30000
  dedup_ttl_ms: 120000
  dedup_db: packet-bridge-a.sqlite3
  max_queue: 128
  max_bridge_hops: 2
  transmit_priority: 0
  tx_delay_min_ms: 3000
  tx_delay_max_ms: 5000

log_level: INFO
